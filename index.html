<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO Review Hub</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f7f7f7}
    .card{background:white;padding:28px;border-radius:14px;box-shadow:0 2px 12px #0001}
    textarea{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 18px;border:1px solid #ccc;border-radius:8px}
    button{padding:11px 18px;border:0;border-radius:8px;cursor:pointer;margin-right:8px}
    #review{background:#111;color:white}
    #status{margin-top:20px;font-weight:bold}
    pre{background:#f1f1f1;padding:14px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
    .small{color:#666;font-size:14px}
  </style>
</head>
<body>
<div class="card">
  <h1>DAO Review Hub</h1>
  <p>Consensus-based DAO proposal evaluation powered by GenLayer.</p>
  <p class="small">Intelligent Contract: DAOProposalReview</p>
  <button id="connect">Connect Wallet</button>
  <p id="wallet">Wallet: Not connected</p>
  <label><strong>DAO Proposal</strong></label>
  <textarea id="proposal" rows="6" placeholder="Enter a DAO proposal..."></textarea>
  <label><strong>Governance Criteria</strong></label>
  <textarea id="criteria" rows="5" placeholder="Enter evaluation criteria..."></textarea>
  <button id="review">Review Proposal</button>
  <p id="status"></p>
  <pre id="result"></pre>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
