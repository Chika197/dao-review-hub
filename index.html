<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO Review Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      margin: 8px 0 16px;
      padding: 12px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 18px;
      cursor: pointer;
      margin-right: 8px;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>DAO Review Hub</h1>
  <p>Consensus-based DAO proposal evaluation powered by GenLayer.</p>

  <button id="connect">Connect Wallet</button>
  <p id="wallet">Wallet: Not connected</p>

  <hr>

  <label for="proposal"><strong>DAO Proposal</strong></label>
  <textarea id="proposal" rows="6"
    placeholder="Enter a DAO proposal..."></textarea>

  <label for="criteria"><strong>Governance Criteria</strong></label>
  <textarea id="criteria" rows="5"
    placeholder="Enter evaluation criteria..."></textarea>

  <button id="review">Review Proposal</button>

  <p id="status"></p>
  <pre id="result"></pre>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
